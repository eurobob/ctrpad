name: Apple release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake ninja
      - name: Build and package
        run: ./package-macos.sh --build
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ctrpad-macos-arm64
          path: |
            dist/CTRPad-macOS-arm64-*.zip
            dist/CTRPad-macOS-arm64-*.zip.sha256
          if-no-files-found: error

  ios:
    name: Unsigned iPhone and iPad IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake ninja
      - name: Build and package
        run: ./package-ios.sh --build
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ctrpad-ios-unsigned
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
          if-no-files-found: error

  release:
    name: Attach packages to tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "CTRPad ${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
